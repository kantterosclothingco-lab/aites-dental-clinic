<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gallery - Aites Dental Clinic</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="logo6.jpg">
<style>
body{
font-family:Arial;
background:#F6FBFC;
text-align:center;
margin:0;
}
h1{
color:#3D1F63;
padding:2rem 0;
}
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
padding:20px;
}
.gallery img{
width:100%;
height:230px;
object-fit:cover;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}
a{
display:inline-block;
margin:20px;
color:#5B2D8B;
font-weight:bold;
}
</style>
</head>
<body>

<h1>Our Dental Gallery</h1>

<div class="gallery">
<script>
for(let i=1;i<=20;i++){
document.write(`<img src="smile${i}.jpg">`);
}
</script>
</div>

<a href="index.html">← Back to Home</a>

</body>
</html>
