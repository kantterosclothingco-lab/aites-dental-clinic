<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aites Dental Clinic</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="logo6.jpg">
<link rel="apple-touch-icon" href="logo6.jpg">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
:root{
  --purple:#5B2D8B;
  --purple-dark:#3D1F63;
  --teal:#1FA7AE;
  --bg:#F6FBFC;
}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:var(--bg);
  scroll-behavior:smooth;
}

nav{
  background:white;
  border-bottom:1px solid rgba(91,45,139,0.15);
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.brand img{ height:50px; }

nav a{
  color:var(--purple);
  font-weight:600;
}

.hero{
  height:85vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:url('smile5.jpg') center/cover no-repeat;
  position:relative;
}
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,255,255,0.78);
}
.hero-content{
  position:relative;
  z-index:2;
}
.hero h1{
  font-family:'Playfair Display',serif;
  color:var(--purple-dark);
  font-size:3rem;
}
.hero p{
  color:var(--purple);
  font-weight:600;
}

.top-booking{
  max-width:1000px;
  margin:-80px auto 60px;
  background:white;
  padding:2rem;
  border-radius:20px;
  box-shadow:0 20px 40px rgba(0,0,0,0.1);
  position:relative;
  z-index:5;
}
.top-booking button{
  background:linear-gradient(145deg,var(--purple),var(--teal));
  border:none;
  color:white;
  font-weight:600;
}

.section{
  padding:4rem 1rem;
  text-align:center;
}
.section h2{
  font-family:'Playfair Display',serif;
  color:var(--purple-dark);
}

.slider{
  max-width:1100px;
  margin:2rem auto;
}
.slider img{
  width:100%;
  height:500px;
  object-fit:cover;
  border-radius:20px;
  box-shadow:0 20px 40px rgba(0,0,0,0.15);
}

footer{
  background:var(--purple-dark);
  color:white;
  padding:2rem;
  text-align:center;
}
</style>
</head>

<body>

<nav class="container-fluid">
<ul>
<li class="brand">
<img src="logo6.jpg">
<span>Aites Dental Clinic</span>
</li>
</ul>
<ul>
<li><a href="#about">About</a></li>
<li><a href="#services">Services</a></li>
<li><a href="gallery.html">Gallery</a></li>
<li><a href="https://www.google.com/maps/search/?api=1&query=7161+N.+T.+Garcia+St.+San+Dionisio+Paranaque+City" target="_blank">📍 Location</a></li>
<li><a href="https://share.google/8jXyqOiLTyc3m56Ia" target="_blank">⭐ Reviews</a></li>
</ul>
</nav>

<section class="hero">
<div class="hero-content">
<h1>Your Health And Smile, Our Commitment</h1>
<p>EST. Since 1996 Established</p>
</div>
</section>

<div class="top-booking">
<h2>Book Appointment</h2>
<form onsubmit="handleBooking(); return false;">
<input type="text" id="name" placeholder="Full Name" required>
<input type="tel" id="phone" placeholder="Contact Number" required>

<select id="service" required>
<option value="">Select Service</option>
<option>Oral Prophylaxis</option>
<option>Root Canal Therapy</option>
<option>Dental Implant</option>
<option>Orthodontics</option>
<option>Teeth Whitening</option>
<option>TMJ Treatment</option>
</select>

<button type="submit">Book Appointment</button>
</form>
</div>

<footer>
© 2026 Aites Dental Clinic • Parañaque City
</footer>

<script>
(function(){
emailjs.init("X7NoFKx6UwAEbSwSk");
})();

function handleBooking(){

var name=document.getElementById("name").value;
var phone=document.getElementById("phone").value;
var service=document.getElementById("service").value;

// SEND EMAIL
emailjs.send("service_ui4h1a8","template_hvu9oqe",{
name:name,
phone:phone,
service:service
}).then(function(response){
console.log("Email sent successfully!");
}, function(error){
console.log("FAILED...", error);
});

// SEND WHATSAPP
var message="Hello Aites Dental Clinic,%0A%0AI would like to book an appointment.%0A%0A"+
"Name: "+encodeURIComponent(name)+"%0A"+
"Contact: "+encodeURIComponent(phone)+"%0A"+
"Service: "+encodeURIComponent(service);

window.open("https://wa.me/639952949645?text="+message,"_blank");

alert("Booking Sent Successfully!");
}
</script>

</body>
</html>
